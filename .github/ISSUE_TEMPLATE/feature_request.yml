name: 功能请求
description: 新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景与场景
      description: 什么场景下需要这个功能？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过或尝试过的其他做法（包括现有工具的变通用法）。
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - Rust 后端（scpi-core / scpi CLI）
        - 插件宿主 / 暴露给模型的工具
        - Profile 格式 / Lua 扩展
        - 打包与发布
        - 文档
        - 不确定
    validations:
      required: false
